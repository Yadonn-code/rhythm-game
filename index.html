<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゆきあかりリズム</title>
<meta name="description" content="雪国が舞台のリズム・ミニゲーム集。音をよく聞いて、ぴったりの瞬間に押そう。">
<meta name="theme-color" content="#070b1f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* 入口：タイトルと、PC版／スマホ版の選択だけ */
:root { --snow: #f4f8ff; --gold: #ffd76a; --line: rgba(200, 225, 255, .25); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; color: var(--snow);
  background:
    radial-gradient(120% 60% at 50% 18%, rgba(79, 224, 200, .28), transparent 60%),
    radial-gradient(80% 40% at 30% 30%, rgba(58, 160, 255, .22), transparent 70%),
    linear-gradient(180deg, #070b28, #18245a 60%, #3b4b8e);
  background-attachment: fixed;
  display: flex;
}
main {
  margin: auto; width: 100%; max-width: 560px; text-align: center;
  display: flex; flex-direction: column; gap: 20px;
  padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.icon { width: 96px; height: 96px; margin: 0 auto; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 20, .5); }
h1 {
  font-size: clamp(40px, 11vw, 64px); font-weight: 800; line-height: 1.1;
  background: linear-gradient(180deg, #fff 20%, #bfe9ff 60%, #8fb8ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 rgba(30, 50, 120, .6));
}
h1 small { display: block; font-size: .26em; letter-spacing: .5em; margin-top: 6px; }
p { line-height: 1.8; font-size: 15px; opacity: .9; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }
.choice {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 18px 16px;
  border-radius: 18px; color: inherit; text-decoration: none;
  background: linear-gradient(160deg, rgba(60, 90, 170, .55), rgba(25, 35, 80, .7));
  border: 1px solid var(--line);
  transition: transform .15s, box-shadow .15s;
}
.choice b { font-size: 20px; }
.choice span { font-size: 13px; opacity: .8; }
.choice:hover, .choice:focus-visible { transform: translateY(-3px); box-shadow: 0 0 0 2px rgba(159, 232, 255, .5); outline: none; }
.choice.rec { border-color: var(--gold); box-shadow: 0 0 24px rgba(255, 215, 106, .25); }
.choice.rec::after {
  content: 'おすすめ'; position: absolute; top: -11px; right: 12px;
  background: var(--gold); color: #18203f; font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 999px;
}
.muted { font-size: 12.5px; opacity: .65; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.svg" alt="">
  <h1>ゆきあかりリズム<small>SNOWLIGHT RHYTHM</small></h1>
  <p>雪国が舞台のリズム・ミニゲーム集。キツネが放った丸太を割ったり、長老ふくろうのリズムをまねしたり。音をよく聞いて、ぴったりの瞬間に！</p>
  <div class="choices">
    <a class="choice" id="pc" href="pc/index.html"><b>🖥️ PC版</b><span>キーボード・マウス操作／全画面</span></a>
    <a class="choice" id="sp" href="sp/index.html"><b>📱 スマホ版</b><span>タップ操作／縦でも横でもOK／振動</span></a>
  </div>
  <p class="muted">音が出ます。ヘッドホン推奨。スマホ版は「ホーム画面に追加」するとアプリのように全画面で遊べます。</p>
</main>
<script>
// 指で操作する小さな画面ならスマホ版を、それ以外はPC版をおすすめする
const touch = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
document.getElementById(touch ? 'sp' : 'pc').classList.add('rec');
</script>
</body>
</html>
